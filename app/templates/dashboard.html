<!DOCTYPE html>
<html lang="en" class="overflow-y-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/output.css')}}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="fixed top-0 left-0 w-[15%] h-screen bg-gray-900 text-white flex flex-col">
        <div class="p-4 border-b border-gray-700">
            <span class="logo_name">Bucal Portal</span>
        </div>
        
        <ul class="flex-1 flex flex-col items-center gap-3 mt-6">
            <li class="w-4/5">
                <a href="{{ url_for('main.index') }}" class="block text-center px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <span class="link_name">Dashboard</span>
                </a>
            </li>
            <li class="w-4/5">
                <a href="{{ url_for('main.enrollment') }}" class="block text-center px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <span class="link_name">Enrollment</span>
                </a>
            </li>
            <li class="w-4/5">
                <a href="{{ url_for('main.grades') }}" class="block text-center px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <span class="link_name">Grades</span>
                </a>
            </li>
            
            <li class="w-4/5 mt-auto mb-6">
                <a href="{{ url_for('main.logout') }}" class="btn btn-danger block text-center px-4 py-3 rounded-lg">
                    <span class="link_name">Logout</span>
                </a>
            </li>
        </ul>
    </div>

    <section class="ml-[15%] w-[85%] min-h-screen bg-gray-50">
        <div class="p-6">
            {% block content %}
            <h1>Graphs</h1>
            {% endblock %}
        </div>
    </section>


    {% block scripts %}{% endblock %}
</body>
</html>
